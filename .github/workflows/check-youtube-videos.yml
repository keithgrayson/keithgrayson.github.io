name: Compare YouTube uploads with website
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compare YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/check_youtube_videos.py
      - name: Commit comparison report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-video-report.md
          if git diff --cached --quiet; then
            echo "Comparison report unchanged; no commit needed."
          else
            git commit -m "Update YouTube video comparison report"
            git push
          fi
