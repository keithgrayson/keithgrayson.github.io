<div id="player-bar">
  <button type="button" class="pb-prev" aria-label="Previous track">&#9198;</button>
  <button type="button" class="pb-toggle" aria-label="Play or pause">&#9658;</button>
  <button type="button" class="pb-next" aria-label="Next track">&#9197;</button>
  <span class="pb-title">&nbsp;</span>
  <div class="pb-progress">
    <input type="range" class="pb-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
  </div>
  <span class="pb-time">0:00 / 0:00</span>
  <button type="button" class="pb-close" aria-label="Close player">&times;</button>
</div>
